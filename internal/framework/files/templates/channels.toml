# Flake inputs - hand-edited source of truth for flake.nix.
# flake.nix itself is generated from this file; never edit it.

# Which channel builds the system (provides lib and the module system).
base = "stable"

# nixpkgs channels. Each becomes a flake input and an overlay exposing
# <name>.<package> in every module.
[channels]
stable = "github:NixOS/nixpkgs/nixos-25.11"
unstable = "github:NixOS/nixpkgs/nixpkgs-unstable"

# Non-nixpkgs flakes. Emitted as plain inputs with no overlay —
# reach them from a module via inputs.<name>.
[flakes]
